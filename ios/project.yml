# XcodeGen spec for the iOS build of Nila Diha's Ghost Radar. The .xcodeproj is generated, never
# committed (same rule as the arivu app on this Mac): `./generate_project.sh`.
#
# Detection is the same MediaPipe EfficientDet-Lite0 int8 model as Android, through the MediaPipe
# Tasks Vision iOS frameworks. Those are fetched by ./fetch_mediapipe.sh into Vendor/ (gitignored,
# 370 MB unpacked) because the CocoaPods route needs a working Ruby, which this Mac does not have.

name: GhostRadar
options:
  bundleIdPrefix: io.github.brettleehari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    # MediaPipe's simulator slice is arm64 + x86_64, but the graph .a is linked by sdk; keep arm64 only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  GhostCore:
    path: GhostCore

targets:
  GhostRadar:
    type: application
    platform: iOS
    sources:
      - path: GhostRadar/Sources
      - path: GhostRadar/Assets.xcassets
      # Loose resources: the model, the three stingers, the three loops, the face, the notices.
      - path: GhostRadar/Resources
        buildPhase: resources
        type: group
    dependencies:
      - package: GhostCore
        product: GhostCore
      # Static XCFrameworks from the MediaPipeTasksVision / MediaPipeTasksCommon 1.0.0 pods.
      - framework: Vendor/MediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - framework: Vendor/MediaPipeTasksCommon/frameworks/MediaPipeTasksCommon.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: CoreHaptics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.brettleehari.ghostradar
        PRODUCT_NAME: GhostRadar
        DEVELOPMENT_TEAM: AJ4SSKV57N
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GhostRadar/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # What the MediaPipeTasksCommon podspec puts in user_target_xcconfig: the graph library
        # must be force-loaded or the detector graph is missing at runtime.
        OTHER_LDFLAGS: "$(inherited) -lc++ -ObjC"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -lc++ -ObjC -force_load \"$(SRCROOT)/Vendor/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a\""
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) -lc++ -ObjC -force_load \"$(SRCROOT)/Vendor/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a\""

schemes:
  GhostRadar:
    build:
      targets:
        GhostRadar: all
    run:
      config: Debug
    archive:
      config: Release
